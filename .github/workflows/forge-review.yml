name: Forge review CI

on:
  pull_request:
    paths:
      - 'labs/intelligence-bakeoff/forge/**'
      - '.github/workflows/forge-review.yml'
  push:
    branches:
      - 'astra/forge-review-ci-20261125'
    paths:
      - 'labs/intelligence-bakeoff/forge/**'
      - '.github/workflows/forge-review.yml'

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Forge unit and adversarial suite
        working-directory: labs/intelligence-bakeoff/forge
        run: python3 -m unittest discover -s tests -v
      - name: Synthetic Entra CLI
        working-directory: labs/intelligence-bakeoff/forge
        run: python3 run.py entra
      - name: Synthetic heldout CLI
        working-directory: labs/intelligence-bakeoff/forge
        run: python3 run.py entra --fixture entra-heldout
      - name: Narrow verified route
        working-directory: labs/intelligence-bakeoff/forge
        run: python3 run.py route --fixture entra-demo --policy-id synthetic-mfa-or-device
