name: Local Defense Factory

on:
  pull_request:
    paths:
      - 'labs/small-model-augmentation/defense_factory/**'
      - '.github/workflows/local-defense-factory.yml'
  push:
    branches: [main]
    paths:
      - 'labs/small-model-augmentation/defense_factory/**'
      - '.github/workflows/local-defense-factory.yml'

permissions:
  contents: read

jobs:
  deterministic:
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        working-directory: labs/small-model-augmentation/defense_factory
        run: python -m py_compile defense_factory.py runner.py test_defense_factory.py test_runner.py
      - name: Unit and adversarial tests
        working-directory: labs/small-model-augmentation/defense_factory
        run: python -m unittest -v test_defense_factory.py test_runner.py
