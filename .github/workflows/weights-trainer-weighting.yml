name: Weights trainer episode-loss invariant

on:
  pull_request:
    paths:
      - 'labs/weights/training/**'
      - '.github/workflows/weights-trainer-weighting.yml'
  push:
    branches:
      - main
    paths:
      - 'labs/weights/training/**'
      - '.github/workflows/weights-trainer-weighting.yml'

permissions:
  contents: read

jobs:
  cpu:
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile weighting contract
        working-directory: labs/weights/training
        run: python -m py_compile episode_weighting.py weighted_trainer.py test_episode_weighting.py
      - name: Run CPU invariant suite
        working-directory: labs/weights/training
        run: python -m unittest -v test_episode_weighting.py
