name: Local Red Factory

on:
  pull_request:
    paths:
      - 'labs/small-model-augmentation/red_factory/**'
      - '.github/workflows/local-red-factory.yml'
  push:
    branches: [main]
    paths:
      - 'labs/small-model-augmentation/red_factory/**'
      - '.github/workflows/local-red-factory.yml'

permissions:
  contents: read

jobs:
  deterministic:
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        working-directory: labs/small-model-augmentation/red_factory
        run: python -m py_compile red_factory.py local_runner.py mcp_fixture.py hermes_runner.py scope_policy.py test_red_factory.py test_local_runner.py test_mcp_fixture.py test_hermes_runner.py test_scope_policy.py
      - name: Unit and adversarial tests
        working-directory: labs/small-model-augmentation/red_factory
        run: python -m unittest -v test_red_factory.py test_local_runner.py test_mcp_fixture.py test_hermes_runner.py test_scope_policy.py
