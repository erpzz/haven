name: HARE query writer
on:
  pull_request:
    paths:
      - 'labs/intelligence-bakeoff/querywriter/**'
      - '.github/workflows/hare-querywriter.yml'
  push:
    branches: [main]
    paths:
      - 'labs/intelligence-bakeoff/querywriter/**'
      - '.github/workflows/hare-querywriter.yml'
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Embedded graph engine (pinned)
        run: python -m pip install kuzu==0.11.3
      - name: Tenant generator, gold, Kùzu execution and strict scoring tests
        working-directory: labs/intelligence-bakeoff/querywriter
        run: python -m unittest discover -s tests -v
      - name: Development suite self-check (deterministic code arm)
        working-directory: labs/intelligence-bakeoff/querywriter
        run: python run.py check
