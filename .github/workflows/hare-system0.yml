name: HARE System 0
on:
  pull_request:
    paths:
      - 'labs/intelligence-bakeoff/system0/**'
      - '.github/workflows/hare-system0.yml'
  push:
    branches: [main]
    paths:
      - 'labs/intelligence-bakeoff/system0/**'
      - '.github/workflows/hare-system0.yml'
permissions:
  contents: read
jobs:
  deterministic:
    # Deterministic checks and enforcement only: no model, network or credentials.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: System 0 checks and enforcement tests
        working-directory: labs/intelligence-bakeoff
        run: python -m unittest discover -s system0/tests -v
      - name: Preregistered code hashes still match
        working-directory: labs/intelligence-bakeoff
        run: python system0/bench_s0.py check
