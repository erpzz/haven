name: Mac Red per-case campaign harness

on:
  push:
    paths:
      - 'labs/small-model-augmentation/mac_red_campaign.py'
      - 'labs/small-model-augmentation/test_mac_red_campaign.py'
      - 'labs/small-model-augmentation/red_factory/mac_red_case_child.py'
      - 'labs/small-model-augmentation/mac_final_gate_control.py'
      - 'labs/small-model-augmentation/test_mac_final_gate_control.py'
      - 'labs/small-model-augmentation/mac_profile_bootstrap.py'
      - 'labs/small-model-augmentation/test_mac_profile_bootstrap.py'
      - 'labs/small-model-augmentation/mac_qualification.py'
      - 'labs/small-model-augmentation/test_mac_qualification.py'
      - '.github/workflows/mac-red-campaign-ci.yml'
  pull_request:
    paths:
      - 'labs/small-model-augmentation/mac_red_campaign.py'
      - 'labs/small-model-augmentation/test_mac_red_campaign.py'
      - 'labs/small-model-augmentation/red_factory/mac_red_case_child.py'
      - '.github/workflows/mac-red-campaign-ci.yml'

permissions:
  contents: read

jobs:
  campaign:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile campaign entrypoints
        run: |
          python -m py_compile \
            labs/small-model-augmentation/mac_red_campaign.py \
            labs/small-model-augmentation/test_mac_red_campaign.py \
            labs/small-model-augmentation/red_factory/mac_red_case_child.py \
            labs/small-model-augmentation/mac_final_gate_control.py \
            labs/small-model-augmentation/test_mac_final_gate_control.py \
            labs/small-model-augmentation/mac_profile_bootstrap.py \
            labs/small-model-augmentation/test_mac_profile_bootstrap.py \
            labs/small-model-augmentation/mac_qualification.py \
            labs/small-model-augmentation/test_mac_qualification.py
      - name: Per-case campaign orchestration
        run: |
          python -m unittest discover \
            -s labs/small-model-augmentation \
            -p 'test_mac_red_campaign.py' -v
          python -m unittest discover \
            -s labs/small-model-augmentation \
            -p 'test_mac_final_gate_control.py' -v
          python -m unittest discover \
            -s labs/small-model-augmentation \
            -p 'test_mac_profile_bootstrap.py' -v
          python -m unittest discover \
            -s labs/small-model-augmentation \
            -p 'test_mac_qualification.py' -v
